name: CI & Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Debounce & cancel superseded builds:
# Immediately cancels any running or queued workflow for the same branch/PR
# when a new commit is pushed, avoiding queued 10-minute builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
